<!doctype html>
<html lang="ja" data-theme="sakura">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花の勝率カウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Zen Maru Gothic", system-ui, sans-serif;
    color: #5a3a4b;
    background:
      radial-gradient(120% 60% at 0% 0%, var(--p1), transparent 60%),
      radial-gradient(100% 50% at 100% 100%, var(--p1), transparent 60%),
      #fffafc;
  }
  .defs { position: absolute; width: 0; height: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; margin: 0 0 6px; }
  h1 svg { width: 40px; height: 40px; }
  .lead { margin: 0 0 24px; color: #8d6a7c; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card {
    display: block;
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid #f6d3e2;
    color: inherit;
    text-decoration: none;
    box-shadow: 0 10px 26px -16px var(--p3);
    transition: transform 0.15s;
  }
  .card:hover { transform: translateY(-2px); }
  .card b { display: block; font-size: 17px; color: var(--p3); margin-bottom: 4px; }
  .card span { font-size: 13px; color: #8d6a7c; }
  ol { margin: 28px 0 0; padding-left: 1.4em; line-height: 1.9; font-size: 14px; }
  code { background: #fff; border: 1px solid #f6d3e2; padding: 1px 6px; border-radius: 6px; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <svg class="defs" aria-hidden="true"><defs id="defs"></defs></svg>
  <main>
    <h1><svg viewBox="-25 -25 50 50" aria-hidden="true"><use href="#wr-flower"/></svg>花の勝率カウンター</h1>
    <p class="lead">OBS用の勝率カウンターです。操作パネルとカウンターは別々のページです。</p>
    <div class="cards">
      <a class="card" href="control.html"><b>操作パネル</b><span>OBSのカスタムブラウザドックに追加して使います</span></a>
      <a class="card" href="counter.html?preview=1"><b>カウンター（プレビュー）</b><span>OBSのブラウザソースに追加して配信に映します</span></a>
    </div>
    <ol>
      <li>OBSの <b>ツール → WebSocketサーバー設定</b> で「WebSocketサーバーを有効にする」をオン</li>
      <li><b>ドック → カスタムブラウザドック</b> に <code id="ctlUrl"></code> を追加し、パスワードを入力</li>
      <li>操作パネルの「カウンターのURLを作成」で花と形を選び、URLをコピー</li>
      <li>OBSで <b>ブラウザ</b> ソースを追加し、コピーしたURLと推奨サイズを入力</li>
    </ol>
  </main>
<script src="flowers.js"></script>
<script>
  document.getElementById("defs").innerHTML = Flowers.defs("sakura");
  document.getElementById("ctlUrl").textContent = new URL(
    location.pathname.endsWith(".html") ? "control.html" : "control", location.href
  ).href;
</script>
</body>
</html>
